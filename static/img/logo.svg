<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" fill="none">
  <defs>
    <linearGradient id="emblemBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="questGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left CodeQuest Emblem Squircle -->
  <g filter="url(#glow)">
    <rect x="6" y="6" width="44" height="44" rx="13" fill="url(#emblemBg)" stroke="url(#emblemBorder)" stroke-width="2" />
    <rect x="8" y="8" width="40" height="40" rx="11" fill="#6366f1" fill-opacity="0.08" />
  </g>

  <!-- Left Code Bracket < -->
  <path d="M 20 20 L 13 28 L 20 36" stroke="#00f0ff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Quest Star ✦ -->
  <path d="M 28 19 Q 28 28 23 28 Q 28 28 28 37 Q 28 28 33 28 Q 28 28 28 19 Z" fill="#ffffff" />
  <circle cx="28" cy="28" r="1.5" fill="#00f0ff" />

  <!-- Right Code Bracket > -->
  <path d="M 36 20 L 43 28 L 36 36" stroke="#a855f7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Brand Typography -->
  <text x="62" y="37" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
    Code<tspan fill="url(#questGrad)">Quest</tspan>
  </text>

  <!-- High-Visibility BD Badge -->
  <g transform="translate(204, 18)">
    <rect x="0" y="0" width="38" height="20" rx="6" fill="url(#bdGrad)" />
    <text x="19" y="14.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.06em">BD</text>
  </g>
</svg>