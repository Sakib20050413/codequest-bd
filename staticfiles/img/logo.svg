<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="logoShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="logoText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0d111b" stroke="url(#logoShield)" stroke-width="2.5" />
    <rect x="5" y="5" width="50" height="50" rx="12" fill="url(#logoShield)" fill-opacity="0.1" />
    <!-- Left Bracket -->
    <path d="M 18 22 L 12 30 L 18 38" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Q -->
    <circle cx="30" cy="28" r="8" stroke="url(#logoShield)" stroke-width="2.5" />
    <path d="M 34 32 L 40 38" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Bracket -->
    <path d="M 42 22 L 48 30 L 42 38" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: CodeQuest -->
  <text x="84" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#logoText)" letter-spacing="-0.03em">
    Code<tspan fill="#6366f1">Quest</tspan>
  </text>

  <!-- Regional Tech Badge: BD -->
  <g transform="translate(254, 28)">
    <rect x="0" y="0" width="36" height="22" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.2" />
    <text x="18" y="15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#06b6d4" text-anchor="middle" letter-spacing="0.05em">BD</text>
  </g>
</svg>
