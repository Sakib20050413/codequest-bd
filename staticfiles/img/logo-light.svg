<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" fill="none">
  <defs>
    <linearGradient id="emblemBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="emblemBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="questGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bdGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left CodeQuest Emblem Squircle -->
  <g filter="url(#shadowLight)">
    <rect x="6" y="6" width="44" height="44" rx="13" fill="url(#emblemBgLight)" stroke="url(#emblemBorderLight)" stroke-width="2" />
    <rect x="8" y="8" width="40" height="40" rx="11" fill="#4f46e5" fill-opacity="0.04" />
  </g>

  <!-- Left Code Bracket < -->
  <path d="M 20 20 L 13 28 L 20 36" stroke="#0284c7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Quest Star ✦ -->
  <path d="M 28 19 Q 28 28 23 28 Q 28 28 28 37 Q 28 28 33 28 Q 28 28 28 19 Z" fill="#4f46e5" />
  <circle cx="28" cy="28" r="1.5" fill="#0284c7" />

  <!-- Right Code Bracket > -->
  <path d="M 36 20 L 43 28 L 36 36" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Brand Typography -->
  <text x="62" y="37" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">
    Code<tspan fill="url(#questGradLight)">Quest</tspan>
  </text>

  <!-- High-Visibility BD Badge -->
  <g transform="translate(204, 18)">
    <rect x="0" y="0" width="38" height="20" rx="6" fill="url(#bdGradLight)" />
    <text x="19" y="14.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.06em">BD</text>
  </g>
</svg>