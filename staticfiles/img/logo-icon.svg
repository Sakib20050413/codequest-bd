<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="cqShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cqGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="cqShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Hexagonal Rounded Shield -->
  <rect x="12" y="12" width="96" height="96" rx="26" fill="#0d111b" stroke="url(#cqShieldGrad)" stroke-width="3" filter="url(#cqShadow)" />
  
  <!-- Subtle Internal Grid Glow -->
  <rect x="20" y="20" width="80" height="80" rx="18" fill="url(#cqShieldGrad)" fill-opacity="0.08" />

  <!-- Code Bracket Left < { -->
  <path d="M 38 42 L 28 60 L 38 78" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Stylized 'Q' -->
  <circle cx="60" cy="56" r="16" stroke="url(#cqGlowGrad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 68 64 L 80 78" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" />

  <!-- Code Bracket Right } > -->
  <path d="M 82 42 L 92 60 L 82 78" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Pulse Sparkle -->
  <circle cx="60" cy="56" r="3" fill="#ffffff" />
</svg>
