<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <g filter="url(#iconGlow)">
    <rect x="12" y="12" width="96" height="96" rx="28" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="4" />
    <rect x="18" y="18" width="84" height="84" rx="22" fill="#6366f1" fill-opacity="0.08" />
  </g>

  <!-- Left Code Bracket < -->
  <path d="M 42 42 L 26 60 L 42 78" stroke="#00f0ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Quest Star ✦ -->
  <path d="M 60 40 Q 60 60 48 60 Q 60 60 60 80 Q 60 60 72 60 Q 60 60 60 40 Z" fill="#ffffff" />
  <circle cx="60" cy="60" r="3.5" fill="#00f0ff" />

  <!-- Right Code Bracket > -->
  <path d="M 78 42 L 94 60 L 78 78" stroke="#a855f7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>