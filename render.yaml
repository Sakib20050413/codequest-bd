services:
  - type: web
    name: codequest-bd
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn codequest_cms.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codequest-db
          property: connectionString

databases:
  - name: codequest-db
    databaseName: codequest_prod
    user: codequest_admin
