{% extends 'base.html' %}

{% block title %}Join Quest — CodeQuest BD{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 shadow-2xl">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-cyan-500/20 text-cyan-400 text-2xl flex items-center justify-center mx-auto border border-cyan-500/30">
                🛡️
            </div>
            <h1 class="text-2xl font-black text-white">Student Registration</h1>
            <p class="text-xs text-slate-400">Join the BAIUST CSE Coding Arena</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs uppercase font-semibold text-slate-300 mb-1.5">Username *</label>
                <input type="text" name="username" required placeholder="e.g. sakib_cse" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-xs uppercase font-semibold text-slate-300 mb-1.5">Full Name</label>
                <input type="text" name="full_name" placeholder="Md Najmus Sakib Rahatul" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-300 mb-1.5">Student ID *</label>
                    <input type="text" name="student_id" required placeholder="1119003" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-300 mb-1.5">Batch / Section</label>
                    <select name="batch_section" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500">
                        <option value="CSE 3-2 Section A">CSE 3-2 Sec A</option>
                        <option value="CSE 3-2 Section B">CSE 3-2 Sec B</option>
                        <option value="CSE 2-2">CSE 2-2</option>
                        <option value="CSE 1-2">CSE 1-2</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase font-semibold text-slate-300 mb-1.5">Avatar Persona</label>
                <select name="avatar" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500">
                    <option value="cyber_rover">Cyber Rover 🤖</option>
                    <option value="code_wizard">Code Wizard 🧙</option>
                    <option value="syntax_ninja">Syntax Ninja 🥷</option>
                    <option value="dom_knight">DOM Knight ⚔️</option>
                    <option value="scholar">BAIUST Scholar 🎓</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-300 mb-1.5">Password *</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-300 mb-1.5">Confirm *</label>
                    <input type="password" name="password_confirm" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-cyan-500/20">
                Create Account & Claim 50 XP 🛡️
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800 text-xs text-slate-400">
            Already have an account? <a href="{% url 'accounts:login' %}" class="text-cyan-400 hover:underline font-semibold">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
