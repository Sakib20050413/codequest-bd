{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CodeQuest BD™ V10.0 — 16 Languages, 108 3D/2D Coding Games &amp; CS50 Visual IDE{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/codequest.css' %}" />
</head>
<body>
  <!-- Live Interactive Constellation & Aurora Background (Req #7) -->
  <canvas id="ambientLiveBgCanvas"></canvas>

  {% include "navbar.html" %}

  <main class="cq-shell" style="padding-top:1.5rem; padding-bottom:3rem;">
    {% block content %}{% endblock %}
  </main>

  {% include "footer.html" %}

  <script>
    // 1. Persistent Dark / Crisp Apple Daylight Theme Switcher (Fixes Req #3 & #6)
    (function initTheme() {
      const saved = localStorage.getItem("cq_v10_theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
    })();

    window.toggleCqTheme = function () {
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("cq_v10_theme", next);
    };

    // 2. Direct Live Webpage DOM Editor Mode (Fixes Req #5)
    let pageEditActive = false;
    window.toggleLivePageEdit = function () {
      pageEditActive = !pageEditActive;
      document.body.contentEditable = pageEditActive ? "true" : "false";
      const btn = document.getElementById("liveEditPageBtn");
      if (btn) {
        btn.textContent = pageEditActive ? "✏️ Edit Page: ON" : "✏️ Edit Page: OFF";
        btn.className = pageEditActive ? "cq-btn cq-btn-primary" : "cq-btn";
      }
    };

    // 3. 60 FPS Ambient Interactive Constellation Background (Req #7)
    (function initAmbientCanvas() {
      const c = document.getElementById("ambientLiveBgCanvas");
      if (!c) return;
      const ctx = c.getContext("2d");
      let w = window.innerWidth, h = window.innerHeight;
      const pts = [];
      for (let i = 0; i < 38; i++) {
        pts.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          r: 1.5 + Math.random() * 1.5
        });
      }
      function resize() {
        w = window.innerWidth; h = window.innerHeight;
        c.width = w; c.height = h;
      }
      resize();
      window.addEventListener("resize", resize);

      function draw() {
        requestAnimationFrame(draw);
        ctx.clearRect(0, 0, w, h);
        const isLight = document.documentElement.getAttribute("data-theme") === "light";
        const dotCol = isLight ? "rgba(2, 132, 199, 0.35)" : "rgba(16, 185, 129, 0.4)";
        const lineCol = isLight ? "rgba(2, 132, 199, 0.08)" : "rgba(56, 189, 248, 0.09)";

        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
          ctx.fillStyle = dotCol;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();

          for (let j = i + 1; j < pts.length; j++) {
            const p2 = pts[j];
            const dx = p.x - p2.x, dy = p.y - p2.y;
            if (dx * dx + dy * dy < 16000) {
              ctx.strokeStyle = lineCol;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }
      }
      draw();
    })();
  </script>
</body>
</html>
